# Сборка готового приложения для Windows: один архив, внутри exe со всем
# нужным (Python, OpenCV, numpy, mss). На машине пользователя ничего
# ставить не надо - распаковать и запустить.
#
# Собирается на каждый push в main и обновляет релиз с тегом latest:
# https://github.com/Dtkek/dota2-draft-helper/releases/tag/latest
# Файл: dota2-draft-helper-windows.zip
name: Сборка для Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Пакеты
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller numpy opencv-python-headless mss certifi

      - name: PyInstaller
        # onedir, а не onefile: приложение пишет рядом с собой кэш API,
        # скачанные портреты и конфиг GSI - при onefile они бы терялись
        # при каждом запуске (распаковка во временную папку).
        run: >
          pyinstaller --noconfirm --clean --onedir --console
          --name dota2-draft-helper
          --paths app
          --add-data "app/web;web"
          --add-data "app/data;data"
          --hidden-import vision.watcher
          --hidden-import vision.capture
          --hidden-import vision.recognize
          --hidden-import vision.icons
          --hidden-import sources.opendota
          --collect-submodules mss
          app/server.py

      - name: Проверка запуска
        # exe должен подняться и ответить по HTTP, иначе сборка бесполезна
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\dota2-draft-helper\dota2-draft-helper.exe" -ArgumentList "--no-browser","--port","8791" -PassThru
          Start-Sleep -Seconds 12
          try {
            $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8791/api/heroes"
            if ($r.StatusCode -ne 200) { throw "HTTP $($r.StatusCode)" }
            $v = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8791/api/vision/status"
            Write-Host $v.Content.Substring(0, [Math]::Min(300, $v.Content.Length))
          } finally {
            Stop-Process -Id $p.Id -Force
          }

      - name: Архив
        shell: pwsh
        run: |
          Copy-Item README.md dist\dota2-draft-helper\README.md -ErrorAction SilentlyContinue
          Copy-Item app\README.md dist\dota2-draft-helper\README-приложение.md
          Compress-Archive -Path dist\dota2-draft-helper -DestinationPath dota2-draft-helper-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dota2-draft-helper-windows
          path: dota2-draft-helper-windows.zip

      - name: Передвинуть тег latest
        if: github.event_name == 'push'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Релиз latest
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          body: |
            Автоматическая сборка из main (${{ github.sha }}).
            Распаковать архив и запустить `dota2-draft-helper.exe` - Python не нужен.
          files: dota2-draft-helper-windows.zip
