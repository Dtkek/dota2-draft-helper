# Сборка готового приложения для Windows: один архив, внутри exe со всем
# нужным (Python, OpenCV, numpy, mss). На машине пользователя ничего
# ставить не надо - распаковать и запустить.
#
# Собирается на каждый push в main и обновляет релиз с тегом latest:
# https://github.com/Dtkek/dota2-draft-helper/releases/tag/latest
# Файл: dota2-draft-helper-windows.zip
name: Сборка для Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Пакеты
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller numpy opencv-python-headless mss certifi pywebview

      - name: PyInstaller
        # onedir, а не onefile: приложение пишет рядом с собой кэш API,
        # скачанные портреты и конфиг GSI - при onefile они бы терялись
        # при каждом запуске (распаковка во временную папку).
        run: >
          pyinstaller --noconfirm --clean --onedir --console
          --name dota2-draft-helper
          --paths app
          --add-data "app/web;web"
          --add-data "app/data;data"
          --hidden-import vision.watcher
          --hidden-import vision.capture
          --hidden-import vision.recognize
          --hidden-import vision.icons
          --hidden-import sources.opendota
          --hidden-import sources.stratz
          --collect-submodules mss
          --collect-all webview
          app/server.py

      - name: Проверка запуска
        # exe должен подняться и ответить по HTTP, иначе сборка бесполезна.
        # Запускается как у пользователя: с окном (не --no-browser), из
        # папки с кириллицей в пути и с меткой «скачано из интернета» на
        # файлах - и то, и другое ломало окно, и ловиться это должно
        # здесь, а не на его машине. Вывод exe печатается целиком;
        # откат окна в браузер считается провалом.
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Рабочий стол\dota2-draft-helper"
          Copy-Item -Recurse dist\dota2-draft-helper $dir
          # ровно то, что делает проводник с файлами из скачанного архива:
          # без этого проверка гоняла «чистую» сборку и проблему не видела
          Get-ChildItem $dir -Recurse -File | ForEach-Object {
            Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          $p = Start-Process -FilePath (Join-Path $dir "dota2-draft-helper.exe") -ArgumentList "--port","8791" -PassThru -RedirectStandardOutput run.log -RedirectStandardError run.err
          Start-Sleep -Seconds 15
          try {
            if ($p.HasExited) { throw "exe завершился с кодом $($p.ExitCode) до проверки" }
            $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8791/api/heroes"
            if ($r.StatusCode -ne 200) { throw "HTTP $($r.StatusCode)" }
            $v = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8791/api/vision/status"
            Write-Host $v.Content.Substring(0, [Math]::Min(300, $v.Content.Length))
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            Start-Sleep -Seconds 1
            Write-Host "--- stdout:"; Get-Content run.log -ErrorAction SilentlyContinue
            Write-Host "--- stderr:"; Get-Content run.err -ErrorAction SilentlyContinue
          }
          $log = (Get-Content run.log -Raw -ErrorAction SilentlyContinue) + (Get-Content run.err -Raw -ErrorAction SilentlyContinue)
          if ($log -match "окно не открылось") { throw "окно pywebview не открылось, сработал откат в браузер - см. вывод выше" }

      - name: Архив
        shell: pwsh
        run: |
          Copy-Item README.md dist\dota2-draft-helper\README.md -ErrorAction SilentlyContinue
          Copy-Item app\README.md dist\dota2-draft-helper\README-приложение.md
          Compress-Archive -Path dist\dota2-draft-helper -DestinationPath dota2-draft-helper-windows.zip

      # артефакт - запасная копия для запусков не с main; релиз ниже
      # прикладывает архив сам. Хранилище артефактов иногда отвечает 403
      # на финализацию - из-за этого один раз падала вся сборка
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: dota2-draft-helper-windows
          path: dota2-draft-helper-windows.zip

      # релиз и на push, и на ручной запуск: через dispatch сборку
      # запускает обновление снимка STRATZ (update-stratz.yml)
      - name: Передвинуть тег latest
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Релиз latest
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          body: |
            Автоматическая сборка из main (${{ github.sha }}).
            Распаковать архив и запустить `dota2-draft-helper.exe` - Python не нужен.
          files: dota2-draft-helper-windows.zip
